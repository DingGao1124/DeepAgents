<!-- ── 2. 组件 DOM ── -->
<!--
  data-fill 标注：
    image → AI 可生成图片填充（抽奖按钮背景图）
    color → AI 只改颜色（背景、文字）
    none  → 不替换内容或素材（动态数据区）
  data-editable="true" → 静态文字，运营可直接修改
-->
<div data-eva="eva-lottery" data-mode="mode4" data-instance="{{INSTANCE_ID}}"
  data-ui-baseline="source-default" data-eva-visual="style-only" data-fill="image"
  role="region" aria-label="抽奖">

  <!-- 主内容区 -->
  <div class="elot-main" data-eva-slot="content" data-eva-visual="layout">

    <!-- 顶部栏：次数 + 刷新 + 查看奖池 -->
    <div class="elot-header" data-eva-slot="header" data-eva-visual="style-only" data-fill="color">
      <div class="elot-header-left">
        <span class="elot-count-text" data-eva-bind="lottery-count" data-fill="none">抽奖次数: -</span>
        <button type="button" class="elot-refresh-btn" data-eva-action="refresh-count"
          aria-label="刷新抽奖次数" data-eva-visual="style-only">
          <!-- refresh icon -->
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>

      <div class="elot-rewards" data-eva-slot="gift-list" aria-label="奖品列表" role="list">

<!-- ── 3. 组件逻辑 ── -->
<script>
(function () {
  'use strict';

  // ── 组件工具（按能力幂等补齐）──
  window.BiliEvaLotteryUtils = window.BiliEvaLotteryUtils || {};
  const lotteryUtils = window.BiliEvaLotteryUtils;

  if (!lotteryUtils.getApiHost) {
    lotteryUtils.getApiHost = function () {
      const url = location.href, h = location.hostname;
      if (h.includes('uat-') || url.includes('_apiEnv_=uat')) return 'uat-api.bilibili.com';
      if (h.includes('pre-') || url.includes('_apiEnv_=pre')) return 'pre-api.bilibili.com';
      return 'api.bilibili.com';
    };
  }
  if (!lotteryUtils.getCsrf) {
    lotteryUtils.getCsrf = function () {
      const m = document.cookie.match(/(?:^|;\s*)bili_jct=([^;]+)/);
      return m ? m[1] : '';
    };
  }
  if (!lotteryUtils.handleUnauthorized) {
    lotteryUtils.handleUnauthorized = function () {
      const gourl = encodeURIComponent(location.href);
      window.biliBridge
        ? window.biliBridge.useNative('auth.login', { type: 'default' })
        : (location.href = `https://passport.bilibili.com/login?gourl=${gourl}`);
    };
  }
  if (!lotteryUtils.delay) {
    lotteryUtils.delay = function (ms, signal) {
      return new Promise((resolve, reject) => {
        const t = setTimeout(resolve, ms);
        signal?.addEventListener('abort', () => {
          clearTimeout(t);
          reject(new DOMException('Aborted', 'AbortError'));
        });
      });
    };
  }
  if (!lotteryUtils.logEvent) {
    lotteryUtils.logEvent = function (name, params) {
      try {
        if (window.logger) window.logger('click', name, params);
      } catch (e) { /* 埋点不阻断业务 */ }
    };
  }

  // ── 全局 Store（幂等）──
  window.BiliEvaLotteryStore = window.BiliEvaLotteryStore || {
    userInfoPromise: null,
    userInfo: null,       // 缓存已解析的用户信息，多实例共用
  };

  // ── 适配器 ──
  const API_MODE = window.__EVA_API_MODE__ || 'preview';

  const MOCK_DATA = {
    '/x/web-interface/nav': { code: 0, data: { mid: 0, isLogin: false } },
    '/x/lottery/x/gift': {
      code: 0,
      data: [
        { id: 'g1', name: '皮肤礼包', img_url: 'https://i0.hdslb.com/bfs/activity-plat/static/10613/11875/11876/20260805/d41d8cd98f00b204e9800998ecf8427e/xGhhQ80Lrg.svg', award_info: { name: '皮肤礼包', icon: 'https://i0.hdslb.com/bfs/activity-plat/static/10613/11875/11876/20260805/d41d8cd98f00b204e9800998ecf8427e/xGhhQ80Lrg.svg' } },
        { id: 'g2', name: '积分×100', img_url: 'https://i0.hdslb.com/bfs/activity-plat/static/10613/11875/11876/20260805/d41d8cd98f00b204e9800998ecf8427e/xGhhQ80Lrg.svg', award_info: { name: '积分×100', icon: 'https://i0.hdslb.com/bfs/activity-plat/static/10613/11875/11876/20260805/d41d8cd98f00b204e9800998ecf8427e/xGhhQ80Lrg.svg' } },
        { id: 'g3', name: '大会员月卡', img_url: 'https://i0.hdslb.com/bfs/activity-plat/static/10613/11875/11876/20260805/d41d8cd98f00b204e9800998ecf8427e/xGhhQ80Lrg.svg', award_info: { name: '大会员月卡', icon: 'https://i0.hdslb.com/bfs/activity-plat/static/10613/11875/11876/20260805/d41d8cd98f00b204e9800998ecf8427e/xGhhQ80Lrg.svg' } },
      ]
    },
    '/x/lottery/x/mytimes': { code: 0, data: { times: 3, lottery_type: 2, points: 0, points_per_time: 0, intergral: null } },
    '/x/lottery/x/do': { code: 0, data: [{ gift_id: 'g1', gift_name: '皮肤礼包', img_url: 'https://i0.hdslb.com/bfs/activity-plat/static/10613/11875/11876/20260805/d41d8cd98f00b204e9800998ecf8427e/xGhhQ80Lrg.svg', award_info: { name: '皮肤礼包', icon: 'https://i0.hdslb.com/bfs/activity-plat/static/10613/11875/11876/20260805/d41d8cd98f00b204e9800998ecf8427e/xGhhQ80Lrg.svg' } }] },
  };

  async function realFetch(url, options) {
    const res = await fetch(url, { credentials: 'include', ...options });
    return res.json();
  }

  async function mockFetch(url, options) {
    await lotteryUtils.delay(400, options?.signal);
    const path = new URL(url).pathname;
    const forcedFailure = window.__EVA_MOCK_FAILURES__?.[path];
    if (forcedFailure) return forcedFailure;
    return MOCK_DATA[path] ?? { code: 0, data: {} };
  }

  const fetcher = API_MODE === 'production' ? realFetch : mockFetch;

  const adapter = {
    async getUserInfo({ signal } = {}) {
      const url = `https://${lotteryUtils.getApiHost()}/x/web-interface/nav`;
      const json = await fetcher(url, { signal });
      if (json.code !== 0) return null;
      return json.data;
    },
    async getGiftsList(lotteryId, { signal } = {}) {
      const url = `https://${lotteryUtils.getApiHost()}/x/lottery/x/gift?sid=${encodeURIComponent(lotteryId)}`;
      const json = await fetcher(url, { signal });
      if (json.code !== 0) return [];
      return json.data || [];
    },
    async getUserTimes(lotteryId, { signal } = {}) {
      const url = `https://${lotteryUtils.getApiHost()}/x/lottery/x/mytimes?sid=${encodeURIComponent(lotteryId)}`;
      const json = await fetcher(url, { signal });
      if (json.code !== 0) return null;
      return json.data || null;
    },
    async doLottery(lotteryId, num, { signal } = {}) {
      // page_id 从页面路径解析
      const pathname = location.pathname;
      const firstIndex = pathname.lastIndexOf('/');
      const secondIndex = pathname.lastIndexOf('.');
      const pageId = secondIndex > firstIndex
        ? pathname.slice(firstIndex + 1, secondIndex)
        : pathname.slice(firstIndex + 1);
      const body = new URLSearchParams({
        sid: lotteryId,
        num: String(num),
        page_id: pageId,
        gaia_vtoken: '',
      });
      return fetcher(`https://${lotteryUtils.getApiHost()}/x/lottery/x/do`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body,
        signal,
      });
    },
  };

  // ── 实例 Store ──
  window.BiliEvaLotteryInstanceStore = window.BiliEvaLotteryInstanceStore || {};

  // ── 常量 ──
  const GIFT_PLACEHOLDER = 'https://i0.hdslb.com/bfs/activity-plat/static/20230425/6319485c5f03766492e9daedb18d2697/Kd0OXrRUiU.png';
  const RECORD_LINK = location.pathname.includes('preview')
    ? 'https://activity.bilibili.com/preview/era/new-award-record.html'
    : 'https://www.bilibili.com/blackboard/era/new-award-record.html';

  // ── Toast ──
  function showToast(msg) {
    const el = document.createElement('div');
    el.className = 'elot-toast';
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2500);
  }

  // ── 渲染奖品列表 ──
  function renderGifts(root, gifts) {
    const container = root.querySelector('[data-eva-slot="gift-list"]');
    if (!container) return;
    // 清空
    while (container.firstChild) container.removeChild(container.firstChild);

    const items = gifts.length > 0 ? gifts : [{}, {}, {}]; // 空时3个占位
    const isPlaceholder = gifts.length === 0;

    // 渲染两份以支持循环轮播
    const copies = gifts.length > 3 ? 2 : 1;
    for (let c = 0; c < copies; c++) {
      const inner = document.createElement('div');
      inner.className = 'elot-rewards-inner';
      items.forEach((item, i) => {
        const li = document.createElement('div');
        li.className = 'elot-reward-item';
        li.setAttribute('role', 'listitem');

        const imgWrap = document.createElement('div');
        imgWrap.className = 'elot-reward-img-wrap';
        const img = document.createElement('img');
        img.className = 'elot-reward-img';
        const imgSrc = item.award_info?.icon || item.img_url || GIFT_PLACEHOLDER;
        img.src = imgSrc ? imgSrc.replace(/^http:/, 'https:') : GIFT_PLACEHOLDER;
        img.alt = item.award_info?.name || item.name || '奖品';
        img.loading = 'lazy';
        imgWrap.appendChild(img);

        const nameEl = document.createElement('div');
        nameEl.className = 'elot-reward-name';
        nameEl.textContent = item.award_info?.name || item.name || '奖品名称';

        li.appendChild(imgWrap);
        li.appendChild(nameEl);
        inner.appendChild(li);
      });
      container.appendChild(inner);
    }

    // 超过3个时启动轮播
    if (gifts.length > 3) {
      startGiftCarousel(container);
    }
  }

  function startGiftCarousel(container) {
    const prefersReducedMotion = window.matchMedia &&
      window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (prefersReducedMotion) return;

    const c1 = container.children[0];
    if (!c1) return;
    const rem = (Math.min(540, window.innerWidth) / 375) * 50;
    const space = rem * 0.21;
    container.scrollLeft = c1.clientWidth + space;

    let lastT = performance.now();
    let currentLeft = container.scrollLeft;
    const af = (t) => {
      const deltaT = t - lastT;
      lastT = t;
      currentLeft += deltaT * 0.05;
      if (currentLeft + container.clientWidth >= container.scrollWidth) {
        currentLeft = c1.clientWidth + space - container.clientWidth;
      }
      container.scrollLeft = Math.round(currentLeft);
      requestAnimationFrame(af);
    };
    requestAnimationFrame(af);
  }

  // ── 渲染次数 ──
  function renderCount(root, timesData) {
    const el = root.querySelector('[data-eva-bind="lottery-count"]');
    if (!el) return;
    if (!timesData) {
      el.textContent = '抽奖次数: -';
      return;
    }
    if (timesData.lottery_type === 2) {
      el.textContent = `抽奖次数: ${timesData.times}`;
    } else {
      const name = timesData.intergral?.name || '积分';
      el.textContent = `${name}: ${timesData.points}`;
    }
  }

  // ── 弹窗 ──
  function openResultModal(root, res) {
    const overlay = root.querySelector('[data-eva-slot="result-modal"]');
    if (!overlay) return;
    const giftsSlot = overlay.querySelector('[data-eva-slot="modal-gifts"]');
    const noResult = overlay.querySelector('[data-eva-state="no-result"]');
    const titleEl = overlay.querySelector('[data-eva-state="modal-title"]');

    while (giftsSlot.firstChild) giftsSlot.removeChild(giftsSlot.firstChild);

    const items = Array.isArray(res) ? res : [];
    // 过滤谢谢参与（gift_id 为空或特殊标记时视为谢谢参与）
    const hasWin = items.length > 0 && items.some(item => item.gift_id || item.gift_name);

    if (hasWin) {
      if (titleEl) titleEl.textContent = '恭喜获奖！';
      noResult.style.display = 'none';
      items.forEach(item => {
        const wrap = document.createElement('div');
        wrap.className = 'elot-modal-gift-item';
        const img = document.createElement('img');
        img.className = 'elot-modal-gift-img';
        const src = item.award_info?.icon || item.img_url || GIFT_PLACEHOLDER;
        img.src = src.replace(/^http:/, 'https:');
        img.alt = item.award_info?.name || item.gift_name || '奖品';
        const name = document.createElement('div');
        name.className = 'elot-modal-gift-name';
        name.textContent = item.award_info?.name || item.gift_name || '奖品';
        wrap.appendChild(img);
        wrap.appendChild(name);
        giftsSlot.appendChild(wrap);
      });
    } else {
      if (titleEl) titleEl.textContent = '谢谢参与！';
      noResult.style.display = '';
    }

    overlay.classList.add('is-open');
    overlay.focus && overlay.focus();
  }

  function closeResultModal(root) {
    const overlay = root.querySelector('[data-eva-slot="result-modal"]');
    if (overlay) overlay.classList.remove('is-open');
  }

  // ── 加载数据 ──
  async function loadData(root, state) {
    const { lotteryId, instanceId } = state;
    if (!lotteryId) return;

    try {
      // 并行加载奖品和次数
      const [gifts, timesData] = await Promise.all([
        adapter.getGiftsList(lotteryId),
        adapter.getUserTimes(lotteryId),
      ]);
      state.gifts = gifts;
      state.timesData = timesData;
      state.loadStatus = 'done';

      renderGifts(root, gifts);
      renderCount(root, timesData);
      root.classList.remove('is-error');
    } catch (e) {
      state.loadStatus = 'error';
      root.classList.add('is-error');
    }
  }

  // ── 抽奖 ──
  async function doDraw(root, state, times) {
    if (state.drawing) return;

    // 未登录检查
    if (!state.isLogin) {
      lotteryUtils.handleUnauthorized();
      return;
    }

    // 1秒去抖
    if (state.drawDebounceTimer) return;
    state.drawDebounceTimer = setTimeout(() => { state.drawDebounceTimer = null; }, 1000);

    state.drawing = true;
    const oneBtnEl = root.querySelector('[data-eva-action="draw-one"]');
    if (oneBtnEl) { oneBtnEl.disabled = true; oneBtnEl.setAttribute('aria-busy', 'true'); oneBtnEl.setAttribute('aria-disabled', 'true'); }

    lotteryUtils.logEvent('lottery1_click');

    try {
      const res = await adapter.doLottery(state.lotteryId, times);
      if (res.code === 0 && res.data) {
        // 乐观更新次数（下限保护）
        if (state.timesData) {
          if (state.timesData.lottery_type === 2) {
            state.timesData.times = isNaN(state.timesData.times - times)
              ? 0
              : Math.max(0, state.timesData.times - times);
          } else {
            const cost = (state.timesData.points_per_time || 0) * times;
            state.timesData.points = Math.max(0, (state.timesData.points || 0) - cost);
          }
          renderCount(root, state.timesData);
        }
        openResultModal(root, res.data);
      } else if (res.code === -101) {
        lotteryUtils.handleUnauthorized();
      } else if (res.code === -504) {
        showToast('当前网络不稳定，请点击我的中奖列表确认或稍后再试');
      } else if (res.code === 170998) {
        showToast('请完成安全验证后重试');
      } else {
        showToast(res.message || '出错啦，请稍后再试～');
      }
    } catch (e) {
      if (e.name !== 'AbortError') showToast('网络错误，请重试');
    } finally {
      state.drawing = false;
      if (oneBtnEl) { oneBtnEl.disabled = false; oneBtnEl.removeAttribute('aria-busy'); oneBtnEl.removeAttribute('aria-disabled'); }
    }
  }

  // ── 刷新次数 ──
  async function refreshCount(root, state) {
    lotteryUtils.logEvent('unit_lottery_refresh_click');
    if (!state.isLogin) {
      lotteryUtils.handleUnauthorized();
      return;
    }
    if (state.isRefreshing) return;
    state.isRefreshing = true;
    const refreshBtn = root.querySelector('[data-eva-action="refresh-count"]');
    if (refreshBtn) refreshBtn.classList.add('is-spinning');

    try {
      const [timesData] = await Promise.all([
        adapter.getUserTimes(state.lotteryId),
        lotteryUtils.delay(1000),
      ]);
      state.timesData = timesData;
      renderCount(root, timesData);
    } finally {
      state.isRefreshing = false;
      if (refreshBtn) refreshBtn.classList.remove('is-spinning');
    }
  }

  // ── 查看奖池按钮显隐（由 open_prize_pool 控制）──
  function applyJackpotVisibility(root, state) {
    const jackpotBtn = root.querySelector('[data-eva-action="view-jackpot"]');
    if (!jackpotBtn) return;
    jackpotBtn.style.display = state.openPrizePool ? '' : 'none';
  }

  function init(root) {
    if (root.dataset.evaInitialized) return;
    root.dataset.evaInitialized = 'mode4';

    const instanceId = root.dataset.instance || '0';
    const componentName = root.dataset.eva;
    const fields = (window.__EVA_DATA_FIELDS__ &&
      window.__EVA_DATA_FIELDS__[`${componentName}_${instanceId}`]) || {};

    const lotteryId = fields.lotteryId || '';
    const activityId = fields.activityId || '';
    // openPrizePool 未填写时默认 true
    const openPrizePool = fields.openPrizePool !== false;

    // styleConfig 来自 dataFields 之外的视觉配置（运营在编辑器设置，fragment 读取 CSS 变量）
    // fragment 不主动读取 styleConfig，使用 CSS 变量默认值

    window.BiliEvaLotteryInstanceStore[instanceId] = window.BiliEvaLotteryInstanceStore[instanceId] || {
      lotteryId,
      activityId,
      instanceId,
      isLogin: false,
      drawing: false,
      drawDebounceTimer: null,
      isRefreshing: false,
      loadStatus: '',
      gifts: [],
      timesData: null,
      openPrizePool: openPrizePool,
    };

    const state = window.BiliEvaLotteryInstanceStore[instanceId];

    applyJackpotVisibility(root, state);

    // 获取登录状态（多实例共用一次请求，缓存已解析结果）
    const globalStore = window.BiliEvaLotteryStore;

    // 若已有缓存结果直接用
    if (globalStore.userInfo !== null) {
      state.isLogin = !!(globalStore.userInfo && globalStore.userInfo.mid);
    } else if (!globalStore.userInfoPromise) {
      // 发起请求，缓存 Promise 以便并发实例复用
      globalStore.userInfoPromise = adapter.getUserInfo()
        .then(data => {
          globalStore.userInfo = data;             // 缓存结果
          return data;
        })
        .catch(() => {
          globalStore.userInfo = null;
          return null;
        });
      globalStore.userInfoPromise.then(data => {
        state.isLogin = !!(data && data.mid);
      });
    } else {
      globalStore.userInfoPromise.then(data => {
        state.isLogin = !!(data && data.mid);
      });
    }

    // 曝光埋点
    lotteryUtils.logEvent('lottery_show');

    // 加载数据
    if (lotteryId) {
      loadData(root, state);
    }

    // 绑定事件
    const oneBtnEl = root.querySelector('[data-eva-action="draw-one"]');
    const refreshBtnEl = root.querySelector('[data-eva-action="refresh-count"]');
    const jackpotBtnEl = root.querySelector('[data-eva-action="view-jackpot"]');
    const recordsBtnEl = root.querySelector('[data-eva-action="view-records"]');
    const closeBtnEl = root.querySelector('[data-eva-action="close-modal"]');
    const retryBtnEl = root.querySelector('[data-eva-action="retry"]');

    if (oneBtnEl) {
      oneBtnEl.addEventListener('click', () => doDraw(root, state, 1));
    }
    if (refreshBtnEl) {
      refreshBtnEl.addEventListener('click', () => refreshCount(root, state));
    }
    if (jackpotBtnEl) {
      jackpotBtnEl.addEventListener('click', () => {
        lotteryUtils.logEvent('unit_lottery_jackpot_click');
        // 奖池详情弹窗由 reference.md 的 GiftsLayer 提供，fragment 中打开简单 alert 代替
        if (state.gifts.length) {
          showToast('奖品: ' + state.gifts.map(g => g.award_info?.name || g.name).join('、'));
        }
      });
    }
    if (recordsBtnEl) {
      const link = activityId
        ? `${RECORD_LINK}?activity_id=${encodeURIComponent(activityId)}`
        : RECORD_LINK;
      recordsBtnEl.addEventListener('click', () => {
        window.open(link);
      });
    }
    if (closeBtnEl) {
      closeBtnEl.addEventListener('click', () => {
        closeResultModal(root);
        // 关闭后刷新次数
        if (state.lotteryId) {
          adapter.getUserTimes(state.lotteryId).then(data => {
            state.timesData = data;
            renderCount(root, data);
          }).catch(() => {});
        }
      });
    }
    if (retryBtnEl) {
      retryBtnEl.addEventListener('click', () => {
        root.classList.remove('is-error');
        loadData(root, state);
      });
    }
  }

  document.querySelectorAll('[data-eva="eva-lottery"][data-mode="mode4"]').forEach(init);

})();
</script>
