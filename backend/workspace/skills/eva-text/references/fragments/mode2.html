<!-- ═══════════════════════════════════════════════════
     短文本 · 模式二：文本转图片
     fragment — 不含 <html>/<head>/<body>，可直接拼入宿主页
     ═══════════════════════════════════════════════════ -->

<!-- ── 1. 组件样式 ── -->
<style>
[data-eva="eva-text"][data-mode="mode2"] {
  --eva-text-width: auto;
  --eva-text-height: 0.48rem;
}

[data-eva="eva-text"][data-mode="mode2"] .etext-img {
  width: var(--eva-text-width);
  height: var(--eva-text-height);
  background-size: contain;
  background-position: center;
  background-repeat: no-repeat;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.24rem;
  color: #999;
  border: 1px dashed #ccc;
  box-sizing: border-box;
}

/* 生图后隐藏占位文字（背景图铺满时文字透明） */
[data-eva="eva-text"][data-mode="mode2"] .etext-img[style*="background-image"] {
  color: transparent;
  border: none;
}
</style>

<!-- ── 2. 组件 DOM ── -->
<div data-eva="eva-text" data-mode="mode2" data-instance="{{INSTANCE_ID}}"
  data-ui-baseline="source-default" data-eva-visual="style-only">
  <div class="etext-img" data-eva-bind="content" data-fill="image" data-fill-gen="true"
    data-gen-prompt="{{content}}" aria-hidden="true">
    <!-- 占位文案由 JS 注入，生图后由 background-image 覆盖 -->
  </div>
</div>

<!-- ── 3. 组件逻辑 ── -->
<script>
(function () {
  'use strict';

  function init(root) {
    if (root.dataset.evaInitialized) return;
    root.dataset.evaInitialized = 'mode2';

    const instanceId = root.dataset.instance || '0';
    const fields = (window.__EVA_DATA_FIELDS__ && window.__EVA_DATA_FIELDS__[`eva-text_${instanceId}`]) || {};

    const imgEl = root.querySelector('[data-eva-bind="content"]');
    if (imgEl) {
      imgEl.setAttribute('aria-label', fields.content || '');
      imgEl.textContent = fields.content || '';
    }
  }

  document.querySelectorAll('[data-eva="eva-text"][data-mode="mode2"]').forEach(init);
})();
</script>
