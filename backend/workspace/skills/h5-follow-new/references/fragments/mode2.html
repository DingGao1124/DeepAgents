<!-- ═══════════════════════════════════════════════════
     H5关注 · 模式二：多UP主关注列表
     fragment — 不含 <html>/<head>/<body>，可直接拼入宿主页
     ═══════════════════════════════════════════════════ -->

<!-- ── 1. 组件样式 ── -->
<style>
[data-eva="h5-follow-new"][data-mode="mode2"] {
  --h5-follow-new-primary: #b0b0b0;
  --h5-follow-new-followed-bg: #d4d4d4;
  --h5-follow-new-followed-color: #888888;
  --h5-follow-new-name-color: #333333;
  --h5-follow-new-border-color: #cccccc;
}

[data-eva="h5-follow-new"][data-mode="mode2"] .h5fn-list-wrap {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
}

[data-eva="h5-follow-new"][data-mode="mode2"] .h5fn-grid {
  display: grid;
  grid-template-columns: repeat(3, auto);
  column-gap: 0;
  row-gap: 0.32rem;
  justify-content: center;
  justify-items: center;
  align-items: center;
  align-content: flex-start;
  padding-inline-start: 0;
  list-style: none;
}

[data-eva="h5-follow-new"][data-mode="mode2"] .h5fn-item {
  width: 2.4rem;
  display: flex;
  flex-direction: column;
  align-items: center;
}

[data-eva="h5-follow-new"][data-mode="mode2"] .h5fn-face-link {
  display: block;
  text-decoration: none;
}

[data-eva="h5-follow-new"][data-mode="mode2"] .h5fn-face {
  width: 1.6rem;
  height: 1.6rem;
  border-radius: 50%;
  background-position: center;
  background-size: cover;
  background-repeat: no-repeat;
  box-shadow: 0 0 0 0.04rem var(--h5-follow-new-border-color);
  margin: 0 auto;
  overflow: hidden;
}

[data-eva="h5-follow-new"][data-mode="mode2"] .h5fn-face img {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  display: block;
}

[data-eva="h5-follow-new"][data-mode="mode2"] .h5fn-name {
  box-sizing: content-box;
  padding: 0.08rem 0 0.16rem;
  width: 2.4rem;
  font-size: 0.24rem;
  line-height: 0.4rem;
  height: 0.4rem;
  overflow: hidden;
  text-align: center;
  white-space: nowrap;
  text-overflow: ellipsis;
  color: var(--h5-follow-new-name-color);
  text-decoration: none;
  display: block;
}

[data-eva="h5-follow-new"][data-mode="mode2"] .h5fn-btn-wrap {
  position: relative;
  width: 1.6rem;
  height: 0.48rem;
  margin: 0 auto;
  cursor: pointer;
  padding: 0;
  border: 0;
  background: transparent;
  font: inherit;
}

[data-eva="h5-follow-new"][data-mode="mode2"] .h5fn-btn-wrap[aria-busy="true"] {
  opacity: 0.7;
  cursor: not-allowed;
}

[data-eva="h5-follow-new"][data-mode="mode2"] .h5fn-btn {
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  background-position: center;
  background-size: contain;
  background-repeat: no-repeat;
  transition: opacity 0.2s ease-in-out;
}

[data-eva="h5-follow-new"][data-mode="mode2"] .h5fn-btn-default {
  opacity: 1;
  background-color: var(--h5-follow-new-primary);
  color: #fff;
  border-radius: 0.08rem;
  text-align: center;
  font-size: 0.26rem;
}

[data-eva="h5-follow-new"][data-mode="mode2"] .h5fn-btn-followed {
  opacity: 0;
  background-color: var(--h5-follow-new-followed-bg);
  color: var(--h5-follow-new-followed-color);
  border-radius: 0.08rem;
  text-align: center;
  font-size: 0.26rem;
}

[data-eva="h5-follow-new"][data-mode="mode2"] .h5fn-item.is-followed .h5fn-btn-default {
  opacity: 0;
}

[data-eva="h5-follow-new"][data-mode="mode2"] .h5fn-item.is-followed .h5fn-btn-followed {
  opacity: 1;
}

[data-eva="h5-follow-new"][data-mode="mode2"] .h5fn-exchange {
  position: relative;
  margin-top: 0.54rem;
  width: 1.68rem;
  height: 0.5rem;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  cursor: pointer;
  padding: 0;
  border: 0;
  font: inherit;
}

[data-eva="h5-follow-new"][data-mode="mode2"] .h5fn-exchange[hidden] {
  display: none;
}

@media (prefers-reduced-motion: reduce) {
  [data-eva="h5-follow-new"][data-mode="mode2"] * {
    transition: none !important;
    animation: none !important;
  }
}

[data-eva="h5-follow-new"][data-mode="mode2"] .h5fn-btn-wrap:focus-visible,
[data-eva="h5-follow-new"][data-mode="mode2"] .h5fn-exchange:focus-visible {
  outline: 2px solid var(--h5-follow-new-primary);
  outline-offset: 2px;
  border-radius: 0.08rem;
}
</style>

<!-- ── 2. 组件 DOM ── -->
<div data-eva="h5-follow-new" data-mode="mode2" data-instance="{{INSTANCE_ID}}"
  data-ui-baseline="source-default" data-eva-visual="style-only" role="region" aria-label="关注UP主列表">
  <div class="h5fn-list-wrap" data-eva-slot="content" data-eva-visual="layout">
    <ul class="h5fn-grid" data-eva-slot="user-list" data-eva-visual="locked" role="list" aria-label="UP主列表">
      <!-- UP主卡片由 JS 动态渲染 -->
    </ul>
    <!-- 换一换按钮（JS 控制显隐） -->
    <button type="button" class="h5fn-exchange" data-eva-action="exchange" data-eva-visual="style-only"
      aria-label="换一换" data-fill="image" hidden>
    </button>
  </div>
</div>

<!-- ── 3. 组件逻辑 ── -->
<script>
(function () {
  'use strict';

  // ── 公共工具（幂等）──
  // ── 关注组件工具（独立命名空间，按能力幂等补齐）──
  window.BiliH5FollowUtils = window.BiliH5FollowUtils || {};
  const followUtils = window.BiliH5FollowUtils;
  if (!followUtils.getApiHost) {
    followUtils.getApiHost = function () {
        const url = location.href, h = location.hostname;
        if (h.includes('uat-') || url.includes('_apiEnv_=uat')) return 'uat-api.bilibili.com';
        if (h.includes('pre-') || url.includes('_apiEnv_=pre')) return 'pre-api.bilibili.com';
        return 'api.bilibili.com';
      };
  }
  if (!followUtils.getCsrf) {
    followUtils.getCsrf = function () {
        const m = document.cookie.match(/(?:^|;\s*)bili_jct=([^;]+)/);
        return m ? m[1] : '';
      };
  }
  if (!followUtils.handleUnauthorized) {
    followUtils.handleUnauthorized = function () {
        const gourl = encodeURIComponent(location.href);
        window.biliBridge
          ? window.biliBridge.useNative('auth.login', { callbackUrl: location.href })
          : (location.href = `https://passport.bilibili.com/login?gourl=${gourl}`);
      };
  }
  if (!followUtils.delay) {
    followUtils.delay = function (ms, signal) {
        return new Promise((resolve, reject) => {
          const t = setTimeout(resolve, ms);
          signal?.addEventListener('abort', () => { clearTimeout(t); reject(new DOMException('Aborted', 'AbortError')); });
        });
      };
  }
  if (!followUtils.shuffle) {
    followUtils.shuffle = function (arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      };
  }

  // ── 事件总线（幂等）──
  if (!window.BiliActEvents) {
    window.BiliActEvents = {
      _listeners: {},
      on(event, fn) { (this._listeners[event] = this._listeners[event] || []).push(fn); },
      emit(event, data) { (this._listeners[event] || []).forEach(fn => fn(data)); },
      off(event, fn) {
        if (!this._listeners[event]) return;
        this._listeners[event] = this._listeners[event].filter(f => f !== fn);
      },
    };
  }

  // ── 全局 Store（幂等）──
  if (!window.BiliFollowNewStore) {
    window.BiliFollowNewStore = {
      followInfoPromise: null,
      userInfoPromise: null,
    };
  }

  // ── 适配器 ──
  const API_MODE = window.__EVA_API_MODE__ || 'preview';

  const MOCK_DATA = {
    '/x/web-interface/nav': { code: 0, data: { mid: 0, isLogin: false } },
    '/x/relation/followings/simple': { code: 0, data: { list: [] } },
    '/x/relation/modify': { code: 0, message: '0' },
  };

  async function realFetch(url, options) {
    const res = await fetch(url, { credentials: 'include', ...options });
    return res.json();
  }

  async function mockFetch(url, options) {
    await followUtils.delay(400, options?.signal);
    const path = new URL(url).pathname;
    const forcedFailure = window.__EVA_MOCK_FAILURES__?.[path];
    if (forcedFailure) return forcedFailure;
    return MOCK_DATA[path] ?? { code: 0, data: {} };
  }

  const fetcher = API_MODE === 'production' ? realFetch : mockFetch;

  const adapter = {
    async getUserInfo({ signal } = {}) {
      const url = `https://${followUtils.getApiHost()}/x/web-interface/nav`;
      const json = await fetcher(url, { signal });
      if (json.code !== 0) return null;
      return json.data;
    },
    async getFollowList({ signal } = {}) {
      const url = `https://${followUtils.getApiHost()}/x/relation/followings/simple`;
      const json = await fetcher(url, { signal });
      if (json.code !== 0) return [];
      // data.list 可能是纯数字数组或对象数组 [{mid, uname, ...}]，统一转 Number
      return (json.data?.list || []).map(item => Number(typeof item === 'object' ? item?.mid : item)).filter(n => !isNaN(n));
    },
    async modifyAttention({ uid, act = 1, signal } = {}) {
      const spmid = window.__BILIACT_PAGEINFO__?.spmid ? `${window.__BILIACT_PAGEINFO__.spmid}.0.0` : '';
      const activityID = window.__BILIACT_PAGEINFO__?.page_id || '';
      const body = new URLSearchParams({
        fid: String(uid),
        act: String(act),
        re_src: '222',
        csrf: followUtils.getCsrf(),
        spmid,
        edit_content: JSON.stringify({ entity: 'activity', entity_id: activityID }),
      });
      return fetcher(`https://${followUtils.getApiHost()}/x/relation/modify`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body,
        signal,
      });
    },
  };

  function tryFetchFollowInfo() {
    const store = window.BiliFollowNewStore;
    if (store.followInfoPromise) return store.followInfoPromise;
    store.followInfoPromise = adapter.getFollowList()
      .then(list => {
        window.BiliActEvents.emit('FOLLOW_INFO_READY', list);
        return list;
      })
      .catch(() => [])
      .finally(() => { store.followInfoPromise = null; });
    return store.followInfoPromise;
  }

  // ── 实例 Store ──
  window.BiliH5FollowNewStore = window.BiliH5FollowNewStore || {};

  function init(root) {
    // 幂等保护：多段脚本同页面执行时，已初始化的实例不重复处理
    if (root.dataset.evaInitialized) return;
    root.dataset.evaInitialized = 'mode2';

    const instanceId = root.dataset.instance || '0';
    const fields = (window.__EVA_DATA_FIELDS__ && window.__EVA_DATA_FIELDS__[`h5-follow-new_${instanceId}`]) || {};

    // 解析 followUidList
    const rawList = Array.isArray(fields.followUidList) ? fields.followUidList : [];
    // 过滤无效条目、去重
    const seen = new Set();
    const fullList = rawList.filter(item => {
      if (!item.uid || !item.uname || !item.face) return false;
      const uid = Number(item.uid);
      if (!uid || seen.has(uid)) return false;
      seen.add(uid);
      return true;
    }).map(item => ({ uid: Number(item.uid), uname: item.uname, face: item.face.replace(/^http:/, 'https:') }));

    const showUpCount = Number(fields.showUpCount) || 3;
    const exChange = !!fields.exChange;
    const filterFollowedUp = !!fields.filterFollowedUp;
    const unfollow = fields.unfollow !== false;

    window.BiliH5FollowNewStore[instanceId] = window.BiliH5FollowNewStore[instanceId] || {
      fullList,
      displayList: [],
      followedList: [],
      currentUserMid: 0,
      firstUnfollowedList: null,
      isFetching: {},
    };

    const state = window.BiliH5FollowNewStore[instanceId];

    // 换一换按钮
    const exchangeBtn = root.querySelector('[data-eva-action="exchange"]');

    // 更新展示列表并重新渲染
    // shuffle：true=主动换一换时重新洗牌；false=仅刷新当前 displayList 的关注状态，不改变展示顺序
    function refreshDisplayList(shuffle) {
      let list = state.fullList;

      // filterFollowedUp：过滤已关注及本人
      if (filterFollowedUp && state.followedList.length > 0) {
        if (!state.firstUnfollowedList) {
          state.firstUnfollowedList = list.filter(
            item => !state.followedList.includes(item.uid) && item.uid !== state.currentUserMid
          );
        }
        list = state.firstUnfollowedList;
      }

      if (shuffle) {
        // 主动换一换：重新洗牌
        if (exChange && list.length > showUpCount) {
          state.displayList = followUtils.shuffle(list).slice(0, showUpCount);
        } else {
          state.displayList = list.slice(0, exChange ? showUpCount : list.length);
        }
      } else if (!state.displayList.length) {
        // 首次初始化
        state.displayList = list.slice(0, exChange ? showUpCount : list.length);
      }
      // 否则保留当前 displayList，只重新渲染关注状态

      renderList(root, state, unfollow);

      // 换一换按钮显隐
      if (exchangeBtn) {
        const shouldShow = exChange && list.length > showUpCount;
        exchangeBtn.hidden = !shouldShow;
      }
    }

    // 监听已关注列表
    const onFollowReady = function (list) {
      state.followedList = Array.isArray(list) ? list.map(Number) : [];
      state.firstUnfollowedList = null; // 重置，重新计算
      refreshDisplayList(false);
    };
    window.BiliActEvents.on('FOLLOW_INFO_READY', onFollowReady);

    // 获取当前用户 mid
    const store = window.BiliFollowNewStore;
    if (!store.userInfoPromise) {
      store.userInfoPromise = adapter.getUserInfo()
        .then(data => { state.currentUserMid = data?.mid || 0; return data; })
        .catch(() => { state.currentUserMid = 0; return null; })
        .finally(() => { store.userInfoPromise = null; });
    } else {
      store.userInfoPromise.then(data => { state.currentUserMid = data?.mid || 0; });
    }

    // 页面级 filterFollowedUp 注入兼容
    if (window.filterFollowedUp) {
      const { followedList } = window.filterFollowedUp;
      if (Array.isArray(followedList)) {
        state.followedList = followedList.map(Number);
      }
    }

    // 初始化展示
    refreshDisplayList(true);

    // 拉取已关注列表（兜底）
    tryFetchFollowInfo().then(list => {
      if (Array.isArray(list) && list.length) {
        state.followedList = list.map(Number);
        state.firstUnfollowedList = null;
        refreshDisplayList(false);
      }
    });

    // 换一换点击
    if (exchangeBtn) {
      const onExChange = function () {
        // 埋点
        logEvent('reissue-popup.click', { pop_type: 'normal', button: 2 });
        state.firstUnfollowedList = null;
        refreshDisplayList(true);
      };
      exchangeBtn.addEventListener('click', onExChange);
    }
  }

  function renderList(root, state, unfollow) {
    const grid = root.querySelector('[data-eva-slot="user-list"]');
    if (!grid) return;

    grid.replaceChildren();
    state.displayList.forEach(function (item) {
      const li = document.createElement('li');
      li.className = 'h5fn-item';
      li.dataset.evaBind = 'follow-user';
      li.dataset.evaVisual = 'layout';
      li.dataset.uid = String(item.uid);
      if (state.followedList.includes(item.uid)) {
        li.classList.add('is-followed');
      }

      const profileUrl = `https://space.bilibili.com/${item.uid}`;

      // ── 头像链接 ──
      const faceLink = document.createElement('a');
      faceLink.className = 'h5fn-face-link';
      faceLink.dataset.evaAction = 'open-profile';
      faceLink.href = profileUrl;
      faceLink.target = '_blank';
      faceLink.rel = 'noopener noreferrer';
      faceLink.setAttribute('aria-label', `前往${item.uname}的空间`);

      const faceDiv = document.createElement('div');
      faceDiv.className = 'h5fn-face';
      faceDiv.dataset.evaVisual = 'style-only';
      faceDiv.dataset.fill = 'none';
      faceDiv.setAttribute('role', 'img');
      faceDiv.setAttribute('aria-label', `${item.uname}的头像`);

      const faceImg = document.createElement('img');
      // 协议升级：防止 http 图片在 https 页面被拦截
      faceImg.src = item.face.replace(/^http:/, 'https:');
      faceImg.dataset.evaBind = 'face';
      faceImg.dataset.evaVisual = 'style-only';
      faceImg.dataset.fill = 'none';
      faceImg.alt = `${item.uname}的头像`;
      faceImg.loading = 'lazy';

      faceDiv.appendChild(faceImg);
      faceLink.appendChild(faceDiv);

      // ── 昵称链接 ──
      const nameLink = document.createElement('a');
      nameLink.className = 'h5fn-name';
      nameLink.dataset.evaAction = 'open-profile';
      nameLink.dataset.evaBind = 'uname';
      nameLink.dataset.evaVisual = 'style-only';
      nameLink.href = profileUrl;
      nameLink.target = '_blank';
      nameLink.rel = 'noopener noreferrer';
      nameLink.dataset.fill = 'none';
      nameLink.setAttribute('aria-label', `前往${item.uname}的空间`);
      nameLink.textContent = item.uname; // textContent 防 XSS

      // ── 关注按钮 ──
      const isFollowed = state.followedList.includes(item.uid);
      const btnWrap = document.createElement('button');
      btnWrap.type = 'button';
      btnWrap.className = 'h5fn-btn-wrap';
      btnWrap.dataset.evaAction = 'toggle-follow';
      btnWrap.dataset.evaVisual = 'style-only';
      btnWrap.setAttribute('aria-label', isFollowed ? '已关注' : '关注');
      btnWrap.setAttribute('aria-pressed', String(isFollowed));

      const btnDefault = document.createElement('span');
      btnDefault.className = 'h5fn-btn h5fn-btn-default';
      btnDefault.dataset.fill = 'image';
      btnDefault.dataset.evaState = 'default';
      btnDefault.dataset.evaVisual = 'style-only';
      btnDefault.textContent = '关注';

      const btnFollowed = document.createElement('span');
      btnFollowed.className = 'h5fn-btn h5fn-btn-followed';
      btnFollowed.dataset.fill = 'image';
      btnFollowed.dataset.evaState = 'followed';
      btnFollowed.dataset.evaVisual = 'style-only';
      btnFollowed.textContent = '已关注';

      btnWrap.appendChild(btnDefault);
      btnWrap.appendChild(btnFollowed);

      li.appendChild(faceLink);
      li.appendChild(nameLink);
      li.appendChild(btnWrap);

      // 绑定关注按钮
      const onClick = function () {
        const uid = item.uid;
        if (state.isFetching[uid]) return;
        const isFollowed = state.followedList.includes(uid);
        if (isFollowed && !unfollow) return;
        doToggleFollow(root, state, uid, isFollowed, li, btnWrap);
      };
      btnWrap.addEventListener('click', onClick);

      grid.appendChild(li);
    });
  }

  async function doToggleFollow(root, state, uid, isFollowed, itemEl, btn) {
    state.isFetching[uid] = true;
    btn.disabled = true;
    btn.setAttribute('aria-busy', 'true');
    btn.setAttribute('aria-disabled', 'true');

    const ac = new AbortController();

    try {
      const res = await adapter.modifyAttention({ uid, act: isFollowed ? 2 : 1, signal: ac.signal });
      switch (res.code) {
        case 0:
          if (!isFollowed) {
            state.followedList = [...state.followedList, uid];
            logEvent('activity_follow_success_' + uid);
            logEvent('reissue-popup.click', { pop_type: 'normal', button: 1, upid: uid });
            window.BiliActEvents.emit('SUMMER_FITNESS_FOLLOW_SEND_POINTS', true);
          } else {
            // 取关：从列表移除（数据驱动，修复源码 bug：不能直接赋值 computed）
            state.followedList = state.followedList.filter(id => id !== uid);
            logEvent('activity_unfollow_success_' + uid);
          }
          // 更新卡片状态
          itemEl.classList.toggle('is-followed', state.followedList.includes(uid));
          btn.setAttribute('aria-pressed', String(state.followedList.includes(uid)));
          btn.setAttribute('aria-label', state.followedList.includes(uid) ? '已关注' : '关注');
          // production 模式下刷新最新关注列表，preview 模式保留乐观更新结果
          if (API_MODE === 'production') {
            tryFetchFollowInfo().then(list => {
              if (Array.isArray(list)) {
                state.followedList = list.map(Number);
                root.querySelectorAll('[data-eva-bind="follow-user"]').forEach(function (el) {
                  const elUid = Number(el.dataset.uid);
                  const followed = state.followedList.includes(elUid);
                  el.classList.toggle('is-followed', followed);
                  const b = el.querySelector('[data-eva-action="toggle-follow"]');
                  if (b) {
                    b.setAttribute('aria-pressed', String(followed));
                    b.setAttribute('aria-label', followed ? '已关注' : '关注');
                  }
                });
              }
            });
          }
          break;
        case -101:
          followUtils.handleUnauthorized();
          break;
        case -102:
          showToast('被封禁用户不能关注哦！');
          break;
        case -400:
          showToast('你时刻都在关注自己哦～');
          break;
        default:
          showToast(res.message || '操作失败，请重试');
      }
    } catch (e) {
      if (e.name !== 'AbortError') showToast('网络错误，请重试');
    } finally {
      state.isFetching[uid] = false;
      btn.disabled = false;
      btn.removeAttribute('aria-busy');
      btn.removeAttribute('aria-disabled');
    }
  }

  function logEvent(name, params) {
    try {
      if (window.logger) window.logger('click', name, params);
    } catch (e) { /* 埋点不阻断业务 */ }
  }

  function showToast(msg) {
    const el = document.createElement('div');
    el.textContent = msg;
    Object.assign(el.style, {
      position: 'fixed', bottom: '15%', left: '50%', transform: 'translateX(-50%)',
      background: 'rgba(0,0,0,0.7)', color: '#fff', padding: '0.16rem 0.32rem',
      borderRadius: '0.08rem', fontSize: '0.28rem', zIndex: '9999',
      whiteSpace: 'nowrap', pointerEvents: 'none',
    });
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2000);
  }

  // 初始化当前已存在的实例
  document.querySelectorAll('[data-eva="h5-follow-new"][data-mode="mode2"]').forEach(init);

})();
</script>
